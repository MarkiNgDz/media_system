---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - jellyfin-config:/config
      - ${SSD_MUSIC_PATH}:/data/ssd/music
      - ${SSD_MOVIE_PATH}:/data/ssd/movie
      - ${SSD_TV_PATH}:/data/ssd/tv
      - ${SSD_JAV_PATH}:/data/ssd/av
      - ${HDD_ANIME_PATH}:/data/hdd/anime
      - ${HDD_TV_PATH}:/data/hdd/tv
      - ${HDD_MOVIE_PATH}:/data/hdd/movie
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

  metatube:
    image: ghcr.io/metatube-community/metatube-server:latest
    container_name: metatube
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - TZ=Asia/Shanghai
      - HTTP_PROXY=${METATUBE_HTTP_PROXY}
      - HTTPS_PROXY=${METATUBE_HTTPS_PROXY}
    volumes:
      - metatube-data:/var/run
    command: -dsn "postgres://metatube:metatube@/metatube?host=/var/run/postgresql" -port 8080 -db-auto-migrate -db-prepared-stmt

  postgres:
    image: postgres:15-alpine
    container_name: metatube-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - metatube-postgres-data:/var/lib/postgresql/data
      - metatube-data:/var/run
    command: "-c TimeZone=Asia/Shanghai -c log_timezone=Asia/Shanghai -c listen_addresses='' -c unix_socket_permissions=0777"

  danmu-api:
    image: logvar/danmu-api:latest
    container_name: danmu-api
    ports:
      - "9321:9321"
    volumes:
      - danmu-api-config:/app/config
      - danmu-api-cache:/app/.cache
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
    command:
      - --cleanup
      - --interval
      - "12600"
      - danmu-api

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - radarr-config:/config
      - ${HDD_MOVIE_PATH}:/data/hdd/movie
      - ${SSD_MOVIE_PATH}:/data/ssd/movie
      - ${DOWNLOAD_PATH}:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - prowlarr-config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - bazarr-config:/config
      - ${SSD_MOVIE_PATH}:/data/ssd/movie
      - ${SSD_TV_PATH}:/data/ssd/tv
      - ${SSD_JAV_PATH}:/data/ssd/av
      - ${HDD_ANIME_PATH}:/data/hdd/anime
      - ${HDD_TV_PATH}:/data/hdd/tv
      - ${HDD_MOVIE_PATH}:/data/hdd/movie
    ports:
      - 6767:6767
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - sonarr-config:/config
      - ${SSD_TV_PATH}:/data/ssd/tv
      - ${HDD_ANIME_PATH}:/data/hdd/anime
      - ${HDD_TV_PATH}:/data/hdd/tv
      - ${DOWNLOAD_PATH}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTURE_SOLVER=${CAPTURE_SOLVER:-none}
      - TZ=Asia/Shanghai
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - qbittorrent-config:/config
      - ${DOWNLOAD_PATH}:/downloads
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s"
    restart: unless-stopped

volumes:
  jellyfin-config:
  metatube-data:
  metatube-postgres-data:
  danmu-api-config:
  danmu-api-cache:
  radarr-config:
  prowlarr-config:
  bazarr-config:
  sonarr-config:
  qbittorrent-config:
